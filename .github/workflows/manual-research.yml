name: Manual Research (System One)

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Research question"
        required: true
        type: string
      max_reflections:
        description: "Maximum reflection/search iterations per section"
        required: true
        default: "2"
        type: choice
        options: ["0", "1", "2", "3"]
      use_system_one:
        description: "Use System One decision model (mercury-decide) for bounded decisions"
        required: true
        default: true
        type: boolean

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      OPENCODE_SESSION_ID: bettafish-${{ github.run_id }}
      OPENCODE_USER_AGENT: bettafish-github-actions/1.0
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}

      QUERY_ENGINE_API_KEY: ${{ secrets.MODEL_API_KEY }}
      QUERY_ENGINE_BASE_URL: ${{ vars.MODEL_BASE_URL }}
      QUERY_ENGINE_MODEL_NAME: ${{ vars.MODEL_NAME }}
      MEDIA_ENGINE_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MEDIA_ENGINE_BASE_URL: ${{ vars.MODEL_BASE_URL }}
      MEDIA_ENGINE_MODEL_NAME: ${{ vars.MODEL_NAME }}
      INSIGHT_ENGINE_API_KEY: ${{ secrets.MODEL_API_KEY }}
      INSIGHT_ENGINE_BASE_URL: ${{ vars.MODEL_BASE_URL }}
      INSIGHT_ENGINE_MODEL_NAME: ${{ vars.MODEL_NAME }}
      REPORT_ENGINE_API_KEY: ${{ secrets.MODEL_API_KEY }}
      REPORT_ENGINE_BASE_URL: ${{ vars.MODEL_BASE_URL }}
      REPORT_ENGINE_MODEL_NAME: ${{ vars.MODEL_NAME }}
      MINDSPIDER_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MINDSPIDER_BASE_URL: ${{ vars.MODEL_BASE_URL }}
      MINDSPIDER_MODEL_NAME: ${{ vars.MODEL_NAME }}
      FORUM_HOST_API_KEY: ${{ secrets.MODEL_API_KEY }}
      FORUM_HOST_BASE_URL: ${{ vars.MODEL_BASE_URL }}
      FORUM_HOST_MODEL_NAME: ${{ vars.MODEL_NAME }}
      KEYWORD_OPTIMIZER_API_KEY: ${{ secrets.MODEL_API_KEY }}
      KEYWORD_OPTIMIZER_BASE_URL: ${{ vars.MODEL_BASE_URL }}
      KEYWORD_OPTIMIZER_MODEL_NAME: ${{ vars.MODEL_NAME }}

      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      ANSPIRE_API_KEY: ${{ secrets.ANSPIRE_API_KEY }}
      SEARCH_TOOL_TYPE: "AnspireAPI"
      # OpenRouter Decisions API key; TYPESAFE_API_KEY kept as legacy fallback.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

      SYSTEM_ONE_ENABLED: ${{ inputs.use_system_one }}
      SYSTEM_ONE_URL: "https://openrouter.ai/api/alpha/decisions"
      SYSTEM_ONE_MODEL: "inception/mercury-decide:free"
      SYSTEM_ONE_TRACE_PATH: "artifacts/system_one_trace.jsonl"
      MAX_REFLECTIONS: ${{ inputs.max_reflections }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-actions.txt

      - name: Validate required configuration
        shell: bash
        run: |
          missing=()
          [[ -n "$MODEL_API_KEY" ]] || missing+=("MODEL_API_KEY")
          [[ -n "$MODEL_NAME" ]] || missing+=("Repository variable MODEL_NAME")
          [[ -n "$TAVILY_API_KEY" ]] || missing+=("TAVILY_API_KEY")
          if [[ "$SYSTEM_ONE_ENABLED" == "true" && -z "$OPENROUTER_API_KEY" && -z "$TYPESAFE_API_KEY" ]]; then
            missing+=("OPENROUTER_API_KEY (or legacy TYPESAFE_API_KEY)")
          fi

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required configuration:\n'
            printf '  - %s\n' "${missing[@]}"
            echo
            echo "MODEL_BASE_URL is read from Repository Variables (vars.MODEL_BASE_URL) and may be empty only for the OpenAI SDK default endpoint."
            exit 1
          fi

          echo "Configuration OK"
          echo "MODEL_NAME=$MODEL_NAME"
          if [[ -n "$MODEL_BASE_URL" ]]; then
            echo "MODEL_BASE_URL is configured"
          else
            echo "MODEL_BASE_URL is empty; OpenAI SDK default endpoint will be used"
          fi

      - name: Install headless dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-actions.txt

      - name: Validate System One decision layer
        run: |
          python -m compileall -q \
            SystemOne \
            QueryEngine \
            MediaEngine/nodes/search_node.py MediaEngine/agent.py MediaEngine/prompts/prompts.py \
            InsightEngine/nodes/search_node.py InsightEngine/agent.py InsightEngine/prompts/prompts.py InsightEngine/tools/keyword_optimizer.py \
            ForumEngine/monitor.py \
            ReportEngine/nodes/template_selection_node.py \
            ReportEngine/nodes/word_budget_node.py \
            ReportEngine/nodes/document_layout_node.py \
            scripts/run_workflow_research.py
          pytest -q tests/test_system_one_decisions.py tests/test_system_one_wiring.py tests/test_report_structure_guard.py tests/test_opencode_go.py

      - name: Run research
        env:
          RESEARCH_QUERY: ${{ inputs.query }}
        run: |
          python scripts/run_workflow_research.py \
            --query "$RESEARCH_QUERY" \
            --output-dir artifacts

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bettafish-research-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
